name: Build windows executable

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-gui.txt
        pip install pyinstaller

    # frontend.py imports main.py, so PyInstaller picks up all Python code by itself.
    # The Azure icons are data files and have to be added explicitly.
    - name: Build EXE
      run: pyinstaller --onefile frontend.py --noconsole --name Cloudinfraviz.exe --add-data "icons;icons"
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cloudinfraviz.exe
        path: ./dist/Cloudinfraviz.exe
